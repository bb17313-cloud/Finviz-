name: Stock Finviz & SEC Radar

on:
  schedule:
    # يعمل كل 5 دقائق من الاثنين إلى الجمعة (1-5) لتغطية جميع جلسات السوق الأمريكي
    - cron: '*/5 8-23 * * 1-5'
    - cron: '*/5 0-1 * * 2-6'

  workflow_dispatch: # يتيح لك تشغيل السكريبت يدوياً في أي وقت

jobs:
  run-radar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run Radar Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py
