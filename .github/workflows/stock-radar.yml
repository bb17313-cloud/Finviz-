name: Stock Radar Bot

on:
  schedule:
    - cron: '*/15 * * * 1-5' # يعمل تلقائياً كل 15 دقيقة في أيام التداول
  workflow_dispatch: # لتشغيله يدوياً متى شئت

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install --no-cache-dir cloudscraper pytz requests

      - name: Run radar script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          PYTHONUNBUFFERED: '1'
        run: |
          python main.py

