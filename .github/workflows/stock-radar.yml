name: Stock Finviz & SEC Radar

on:
  schedule:
    - cron: '*/3 * * * *' # كل 3 دقائق (يتوقف السكربت تلقائياً خارج أوقات الجلسات)
  workflow_dispatch: # تشغيل يدوي في أي وقت

concurrency:
  group: stock-radar
  cancel-in-progress: true

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Radar State
        uses: actions/cache@v4
        with:
          path: radar_state.json
          key: radar-state-${{ github.run_id }}
          restore-keys: |
            radar-state-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz googletrans==4.0.0-rc1

      - name: Run Radar Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RADAR_STATE_FILE: radar_state.json
        run: |
          python main.py
